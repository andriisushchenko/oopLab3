<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetGo - Ставки на Кіберспорт</title>
    <!-- Підключаємо красиві стилі Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-center mb-5">🎮 BetGo: Платформа для ставок</h1>

        <div class="row">
            <!-- Блок 1: Поповнення балансу -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h3 class="card-title">💰 Поповнення балансу</h3>
                        <p class="text-muted">Діє для користувача (ID = 1)</p>

                        <div class="input-group mb-3">
                            <input type="number" id="topupAmount" class="form-control" placeholder="Введіть суму">
                            <button class="btn btn-success" onclick="topUpBalance()">Поповнити</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Блок 2: Зробити ставку -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h3 class="card-title">🎲 Зробити ставку</h3>
                        <p class="text-muted">Матч: NAVI vs Vitality (ID = 1)</p>

                        <div class="mb-3">
                            <label class="form-label">Сума ставки:</label>
                            <input type="number" id="betAmount" class="form-control mb-3" placeholder="Скільки ставимо?">

                            <label class="form-label">Ваш прогноз:</label>
                            <select id="betResult" class="form-select mb-4">
                                <option value="1">Перемога команди 1 (NAVI)</option>
                                <option value="2">Перемога команди 2 (Vitality)</option>
                                <option value="3">Нічия</option>
                            </select>

                            <button class="btn btn-primary w-100" onclick="placeBet()">Зробити ставку</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript для зв'язку з твоїм Python API -->
    <script>
        // Відправляємо запит на поповнення
        async function topUpBalance() {
            const amount = document.getElementById('topupAmount').value;
            const response = await fetch('/api/users/1/top-up/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount: amount })
            });
            const data = await response.json();

            if (response.ok) {
                alert("✅ " + data.message + "\nВаш новий баланс: " + data.new_balance);
            } else {
                alert("❌ Помилка: " + data.error);
            }
        }

        // Відправляємо запит на створення ставки
        async function placeBet() {
            const amount = document.getElementById('betAmount').value;
            const result = document.getElementById('betResult').value;

            const response = await fetch('/api/bets/place/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: 1,
                    matchId: 1,
                    amount: amount,
                    predictedResult: parseInt(result)
                })
            });
            const data = await response.json();

            if (response.ok) {
                alert("✅ " + data.message + "\nЗалишок на балансі: " + data.remaining_balance);
            } else {
                alert("❌ Помилка: " + data.error);
            }
        }
    </script>
</body>
</html>
